# ==============================================================================
# Layer 6/7: Nginx Hardened Reverse Proxy & TLS Termination
# 防御: 中間者攻撃 (MitM), BREACH/CRIME 攻撃, バッファオーバーフロー, スロー通信DoS
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. サーバー情報の秘匿 (Banner Grabbing 防御)
    server_tokens off;

    # 2. タイムアウト & バッファ制限 (Slowloris / DoS / バッファオーバーフロー対策)
    client_body_buffer_size     128k;
    client_max_body_size        10m;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 4k;
    
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          10s;

    # 3. 圧縮設定 & BREACH/CRIME 対策
    # 動的機密データ(セッショントークン等)とユーザー入力が混ざるレスポンスの圧縮を避けるため、
    # 静的アセット(CSS/JS/JSON)に限定して gzip を適用
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_disable "msie6";

    # 4. アップストリーム (Go コンテナバックエンド)
    upstream backend_app {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 5. HTTP -> HTTPS リダイレクト
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 6. HTTPS サーバー (Hardened TLS 1.3 / 1.2)
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # TLS 証明書 & 暗号化キー
        ssl_certificate     /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;

        # TLS バージョン制限 (TLSv1.2, TLSv1.3 のみ許可)
        ssl_protocols TLSv1.2 TLSv1.3;

        # 強固な暗号スイート (PFS: ECDHE, AEAD: GCM / CHACHA20-POLY1305)
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;

        # セッション再開 & チケット (前方秘匿性を維持するための設定)
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling (証明書失効確認の高速化 & プライバシー保護)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # セキュリティレスポンスヘッダー
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        location / {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            # プロキシヘッダーの厳格な付与
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # タイムアウト
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }

        # ヘルスチェックエンドポイント
        location /healthz {
            access_log off;
            return 200 "OK";
        }
    }
}
